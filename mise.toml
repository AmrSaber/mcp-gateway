[tools]
go = "1"
golangci-lint = "latest"

[tasks.build]
description = "Build the project into ~/.local/bin/mcp-gateway"
depends = ["test"]
run = "go build -o ~/.local/bin/mcp-gateway ."

[tasks.test]
description = "Run vet, lint, and unit tests"
run = ["go vet ./...", "golangci-lint run ./...", "go test -race ./..."]

[tasks.edit]
description = "Edit mise file"
run = "$EDITOR mise.toml"
